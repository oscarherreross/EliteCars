<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><!-- Define la codificación de caracteres para el documento -->
    <meta name="viewport" content="width=device-width, initial-scale=1"><!-- Hace que la página web sea responsive -->
    <title>Carrito EliteCars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous"> <!-- Enlaza la hoja de estilos de Bootstrap -->
    <link rel="stylesheet" type="text/css" href="../FicherosCSS/Inicio_EliteCars.css"> <!-- Enlaza la hoja de estilos personalizada para la página -->
    <link rel="icon" href="../ImagenesCoches/LogoEliteCars.jpeg" type="image/jpeg"> <!-- Define el icono de la página web -->
</head>
<body>
    <mi-cabecera></mi-cabecera>

    <section>
            <div id="carrito">
              <br>
              <h2>Carrito de Compras</h2>
              <table>
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio (1ud)</th>
                    <th>Total</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="contenidoCarrito">
                  <!-- Aquí se insertarán las filas de la tabla -->
                </tbody>
              </table>
              <br>
            </div> 
            <a id='comprar' onclick='procesarCompra()' class="btn btn-secondary">Procesar pedido</a>
            <a id='vaciar' onclick=vaciarCarrito() class="btn btn-secondary">Vaciar carrito</a>
            <br>

            <div id="ticket">

            </div>         
    </section>

    <mi-pie></mi-pie>
    <script src="../FicherosJS/Cabecera_EliteCars.js"></script>
    <script src="../FicherosJS/PiePag_EliteCars.js"></script>
    <script src="../FicherosJS/Carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script>
      window.onload = function() {
        generarContenidoCarrito();
      }
    </script>
</body>
</html>
